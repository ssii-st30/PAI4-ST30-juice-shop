# SAST y SCA
# Responsable: persona A
name: SAST y SCA

on:
  workflow_call:

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep (JS/TS + OWASP Top 10)
        continue-on-error: true
        run: |
          pip install --quiet semgrep==1.185.0
          EXCLUDE_ARGS=""
          if [ -f security/semgrep/.semgrepignore ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line=$(echo "$line" | sed 's/#.*//' | xargs)
              [ -n "$line" ] && EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude=$line"
            done < security/semgrep/.semgrepignore
          fi
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/owasp-top-ten \
            $EXCLUDE_ARGS \
            --json \
            --output semgrep.json \
            .

      - name: Generar resumen de severidad SAST
        if: always()
        run: |
          ERROR_COUNT=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          WARNING_COUNT=$(jq '[.results[] | select(.extra.severity == "WARNING")] | length' semgrep.json)
          echo "### Resumen SAST (Semgrep)" >> $GITHUB_STEP_SUMMARY
          echo "- Hallazgos **ERROR** (Critical/High): **$ERROR_COUNT**" >> $GITHUB_STEP_SUMMARY echo "- Hallazgos **WARNING** (Medium): **$WARNING_COUNT**" >> $GITHUB_STEP_SUMMARY
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::warning::Semgrep detectó $ERROR_COUNT hallazgos de severidad ERROR (modo aviso, no bloquea)."
          fi

      - name: Subir artifact report-semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-semgrep
          path: semgrep.json
          if-no-files-found: error

      - name: Importar informe SAST en DefectDojo
        if: always()
        uses: ./.github/actions/defectdojo-import
        with:
          file: semgrep.json
          scan-type: 'Semgrep JSON Report'
          tool: 'Semgrep'
          url: ${{ secrets.DEFECTDOJO_URL }}
          api-key: ${{ secrets.DEFECTDOJO_API_KEY }}

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar package-lock.json generado en Build
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-lockfile

      - name: Caché de la base de datos NVD
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: |
            nvd-data-

      - name: Ejecutar OWASP Dependency-Check
        continue-on-error: true
        run: |
          mkdir -p reports ~/.dependency-check-data
          chmod -R 777 reports ~/.dependency-check-data
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "$HOME/.dependency-check-data:/usr/share/dependency-check/data" \
            -v "${{ github.workspace }}/reports:/report" \
            owasp/dependency-check:13.0.0 \
            --scan /src/package.json \
            --scan /src/package-lock.json \
            --format XML \
            --project "Juice Shop ST-30" \
            --out /report \
            --failOnCVSS 7 \
            --suppression /src/security/dependency-check/suppressions.xml \
            --nvdApiKey "${{ secrets.NVD_API_KEY }}" \
            --nvdMaxRetryCount 3

      - name: Escribir resumen SCA en el job
        if: always()
        run: |
          echo "### Resumen SCA (OWASP Dependency-Check)" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/dependency-check-report.xml ]; then
            CRIT_COUNT=$(grep -Eic "<severity[^>]*>critical</severity>" reports/dependency-check-report.xml || true)
            HIGH_COUNT=$(grep -Eic "<severity[^>]*>high</severity>" reports/dependency-check-report.xml || true)
            TOTAL_HC=$((CRIT_COUNT + HIGH_COUNT)) echo "- Vulnerabilidades **Critical**: **$CRIT_COUNT**" >> $GITHUB_STEP_SUMMARY
            echo "- Vulnerabilidades **High**: **$HIGH_COUNT**" >> $GITHUB_STEP_SUMMARY echo "- Total **Critical/High (CVSS >= 7)**: **$TOTAL_HC**" >> $GITHUB_STEP_SUMMARY
            if [ "$TOTAL_HC" -gt 0 ]; then
              echo "::warning::Dependency-Check detectó $TOTAL_HC vulnerabilidades Critical/High ($CRIT_COUNT Critical,$HIGH_COUNT High) (modo aviso, no bloquea)."
            fi
          else
            echo "- No se generó el informe XML." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Subir artifact report-dependency-check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-dependency-check
          path: reports/dependency-check-report.xml
          if-no-files-found: error

      - name: Importar informe SCA en DefectDojo
        if: always()
        uses: ./.github/actions/defectdojo-import
        with:
          file: reports/dependency-check-report.xml
          scan-type: 'Dependency Check Scan'
          tool: 'OWASP Dependency-Check'