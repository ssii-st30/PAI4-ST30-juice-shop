# Build
# Responsable: persona A
name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generar package-lock.json e instalar dependencias
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --legacy-peer-deps
          npm ci --ignore-scripts --legacy-peer-deps

      - name: Compilar servidor (build:server)
        run: npm run build:server

      - name: Subir package-lock.json para Dependency-Check (SCA)
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-lockfile
          path: package-lock.json
          retention-days: 1