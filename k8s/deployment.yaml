# Despliegue de OWASP Juice Shop en Kubernetes (v2, endurecido tras el análisis de KICS)
# Responsable: persona B
# La imagen la construye y publica el job image-scan del pipeline en GHCR.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      automountServiceAccountToken: false   # la aplicación no usa la API de Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532                     # usuario sin privilegios de la imagen distroless
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: juice-shop
          image: ghcr.io/ssii-st30/juice-shop:IMAGE_TAG   # el job de despliegue sustituye IMAGE_TAG por el sha del commit
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
            # AppArmor no se fija: el clúster kind del despliegue no tiene AppArmor activado y
            # Kubernetes rechaza los pods que lo exigen. Riesgo aceptado (severidad baja);
            # en un clúster de producción con AppArmor se añadiría appArmorProfile: RuntimeDefault.
            # Juice Shop escribe en tiempo de ejecución su base de datos SQLite (data/),
            # los logs y los ficheros subidos, por lo que no puede tener el sistema de
            # ficheros raíz en solo lectura. Riesgo aceptado y documentado en DefectDojo.
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Juice Shop tarda en arrancar con 0,5 CPU: la startupProbe le da hasta 3 minutos
          # antes de que empiecen a contar la readiness y la liveness.
          startupProbe:
            httpGet:
              path: /rest/admin/application-version
              port: 3000
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
# Garantiza que al menos una réplica siga disponible durante mantenimientos del clúster
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: juice-shop
